name: CI

# PR-only by design: pushing to a branch (including main via a merged PR)
# must never rebuild or retest on its own — releases are cut exclusively
# by v* tags (release.yml), and the repo owner was explicit that a bare
# push should not light up CI. workflow_dispatch covers manual runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (test + package)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus-x11 nftables

      - name: Install pinned build tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # main.go embeds frontend/dist, so the frontend must exist before any
      # command that loads the root Go package (test, vet, or bindings).
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: Isolated nftables recovery
        run: |
          go test -c -o "$RUNNER_TEMP/wireguide-firewall.test" ./internal/firewall
          sudo unshare --net env WIREGUIDE_TEST_NFT=1 "$RUNNER_TEMP/wireguide-firewall.test" -test.run 'InKernel$' -test.v

      - name: Build native Linux binary
        run: task linux:build ARCH=${{ matrix.arch }}

      - name: Native GTK4 connection icon and webview
        # Hosted runners deny bubblewrap's user-namespace setup. This fixture
        # serves only an in-memory page and opens no profiles or VPN/helper.
        # Keep this override in CI; production retains WebKit's sandbox.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: WIREGUIDE_TEST_APP_ICON=1 go test -race ./internal/gui -run '^TestNative(ApplicationConnectionIcon|GTK4WebviewRoundTrip)$' -count=1 -v

      - name: Check runtime linking
        run: |
          file bin/wireguide
          if ldd bin/wireguide | grep -q 'not found'; then
            ldd bin/wireguide
            exit 1
          fi

      - name: Build and inspect DEB
        env:
          GOARCH: ${{ matrix.arch }}
          GIT_COMMITTER_NAME: WireGuide CI
          GIT_COMMITTER_EMAIL: noreply@example.com
        run: |
          wails3 tool package -name wireguide -format deb -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          dpkg-deb --info bin/wireguide.deb
          dpkg-deb --contents bin/wireguide.deb

      # Mirrors release.yml's RPM step so a broken overrides.rpm block in
      # nfpm.yaml fails the PR instead of the tag build.
      - name: Build and inspect RPM
        env:
          GOARCH: ${{ matrix.arch }}
          GIT_COMMITTER_NAME: WireGuide CI
          GIT_COMMITTER_EMAIL: noreply@example.com
        run: |
          sudo apt-get install -y rpm
          wails3 tool package -name wireguide -format rpm -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          rpm -qip bin/wireguide.rpm
          rpm -qp --requires bin/wireguide.rpm
          rpm -qp --recommends bin/wireguide.rpm
          rpm -qpl bin/wireguide.rpm

      - name: Install RPM on Fedora
        run: |
          docker run --rm -v "$PWD/bin:/packages:ro" registry.fedoraproject.org/fedora:44 \
            sh -ec 'dnf -y install /packages/wireguide.rpm; rpm -q wireguide; wireguide ctl --help'

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-${{ matrix.arch }}-ci
          path: |
            bin/wireguide
            bin/wireguide.deb
            bin/wireguide.rpm
          if-no-files-found: error
          retention-days: 7

  # Keep the required check name stable while requiring both Linux architectures.
  linux-status:
    name: Linux (test + package)
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Linux architectures to pass
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$LINUX_RESULT" = success

  macos:
    name: macOS (test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: Build macOS application bundle
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          export PATH="$HOME/go/bin:$PATH"
          task darwin:package ARCH=arm64
          codesign --verify --deep --strict bin/wireguide.app

  windows:
    name: Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # No -race on Windows: the race detector needs cgo + a C toolchain,
      # and the runner's mingw setup is not something we want this suite
      # to depend on. The Linux job's -race pass covers the shared code.
      - name: Test and vet
        shell: pwsh
        run: |
          # PowerShell otherwise reports only the last native command's exit
          # code: a passing vet must never hide a failing test run.
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check reachable Go vulnerabilities
        shell: pwsh
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application and installer
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:USERPROFILE\go\bin;$env:PATH"
          task windows:package ARCH=amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
